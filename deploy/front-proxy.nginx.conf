# Farash routes for the server's shared front nginx.
# Include this inside the HTTPS server block for FARASH_DOMAIN. The proxy
# container and Farash API/web containers must all join the external proxynet
# network. Variables defer Docker DNS resolution until request time, so nginx
# still starts while the Farash stack is temporarily down.
resolver 127.0.0.11 valid=30s;

set $farash_api farash-api:8080;
set $farash_web farash-web:80;

location /api/ {
    proxy_pass http://$farash_api;
    proxy_set_header Host $host;
    proxy_set_header X-Farash-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://$farash_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
