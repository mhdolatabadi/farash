services:
  api:
    image: ${FARASH_IMAGE_REPO:-ghcr.io/mhdolatabadi/farash}/api:${FARASH_IMAGE_TAG:-latest}
    build:
      context: ../server
    restart: unless-stopped
    environment:
      WEB_ORIGIN: https://${FARASH_DOMAIN}
      DATABASE_URL: postgres://farash:${POSTGRES_PASSWORD}@postgres:5432/farash?sslmode=disable
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-24}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]

  web:
    image: ${FARASH_IMAGE_REPO:-ghcr.io/mhdolatabadi/farash}/web:${FARASH_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    networks: [edge]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: farash
      POSTGRES_USER: farash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farash -d farash"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FARASH_DOMAIN: ${FARASH_DOMAIN:?set FARASH_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    networks: [edge]

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
