name: Android release

on:
  push:
    tags: ['v[0-9]*']
  # Every merge to main builds a signed APK/AAB once its Quality checks pass.
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (major.minor.patch)'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 tool/android_release_metadata.py resolve
      - name: Require successful Quality checks on this source commit
        # A workflow_run release only starts after Quality checks succeeded on its commit.
        if: github.event_name != 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            checked="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
            if [[ "$checked" == "$GITHUB_SHA" ]]; then exit 0; fi
            echo "Waiting for successful Quality checks ($attempt/20)."
            sleep 15
          done
          echo 'Successful Quality checks for this exact commit are required.' >&2
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Prepare private release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tool/prepare_android_signing.py
      - name: Build signed release APK and AAB
        env:
          API_BASE_URL: ${{ vars.FARASH_API_BASE_URL || 'https://farash.mhdolatabadi.ir' }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          flutter build apk --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" --dart-define=API_BASE_URL="$API_BASE_URL"
          flutter build appbundle --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Verify signatures, package and release mode
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: bash tool/verify_android_release.sh
      - name: Prepare versioned artifacts and checksums
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/farash-$VERSION_NAME-$VERSION_CODE.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release/farash-$VERSION_NAME-$VERSION_CODE.aab"
          (cd release && sha256sum ./*.apk ./*.aab > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: farash-release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Publish immutable tagged release downloads
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]] || { echo 'Tag source mismatch.' >&2; exit 1; }
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; assets are never overwritten. Use a new version tag.' >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/farash-release-notes.md" <<EOF
          Signed Farash Android release $VERSION_NAME (build $VERSION_CODE).

          - APK: install directly on Android; verify it against SHA256SUMS.
          - AAB: store submission bundle; not a directly installable APK.
          - Source: $GITHUB_SHA
          - Build and checks: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Android may request permission to install from this source. Store submission and device upgrade validation are separate rollout steps.
          EOF
          gh release create "$RELEASE_TAG" release/*.apk release/*.aab release/SHA256SUMS --verify-tag --draft --title "Farash $VERSION_NAME" --notes-file "$RUNNER_TEMP/farash-release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Publish main build as a pre-release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          # Each build code is unique, so every merge to main gets its own downloadable release.
          tag="build-$VERSION_NAME-$VERSION_CODE"
          cat > "$RUNNER_TEMP/farash-release-notes.md" <<EOF
          Automatic signed Farash Android build $VERSION_NAME (build $VERSION_CODE) from main.

          - APK: install directly on Android; verify it against SHA256SUMS.
          - AAB: store submission bundle; not a directly installable APK.
          - Source: $SOURCE_SHA
          - Build and checks: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$tag" release/*.apk release/*.aab release/SHA256SUMS --target "$SOURCE_SHA" --prerelease --title "Farash $VERSION_NAME (build $VERSION_CODE)" --notes-file "$RUNNER_TEMP/farash-release-notes.md"
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/farash-release.jks" "$RUNNER_TEMP/release-cert.der" "$RUNNER_TEMP/aab-cert.der" "$RUNNER_TEMP/aab-cert.pem"
