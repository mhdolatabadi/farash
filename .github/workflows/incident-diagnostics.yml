name: Incident diagnostics

on:
  push:
    branches: [fix/144-shared-proxy]

permissions:
  contents: read

jobs:
  inspect-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate diagnostics secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect production proxy read-only
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo '== identity ==' 
          id
          hostname
          echo '== listeners 22/80/443 ==' 
          ss -ltnp 2>/dev/null | grep -E '(:22|:80|:443)([[:space:]]|$)' || true
          echo '== docker containers ==' 
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Networks}}\t{{.Ports}}'
          echo '== docker networks ==' 
          docker network ls
          echo '== front proxy candidate ==' 
          proxy="$(docker ps --filter publish=80 --format '{{.Names}}' | head -n 1)"
          printf 'proxy=%s\n' "$proxy"
          if [ -n "$proxy" ]; then
            docker inspect "$proxy" --format 'networks={{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
            docker inspect "$proxy" --format 'mounts={{range .Mounts}}{{.Source}} -> {{.Destination}}; {{end}}'
            if docker exec "$proxy" nginx -v >/dev/null 2>&1; then
              echo '== proxy nginx routes (filtered) ==' 
              docker exec "$proxy" nginx -T 2>&1 | grep -nE 'server_name|proxy_pass|rhythmo|nafir|saatbashi|atid|farash|listen' | head -n 300 || true
              echo '== exact farash nginx block =='
              docker exec "$proxy" nginx -T 2>&1 | sed -n '385,417p' || true
            fi
          fi
          echo '== proxynet inspection ==' 
          docker network inspect proxynet --format '{{range $id,$c := .Containers}}{{$c.Name}} {{end}}' 2>/dev/null || true
          echo
          echo '== farash containers ==' 
          for name in $(docker ps -a --format '{{.Names}}' | grep '^farash-' || true); do
            docker inspect "$name" --format '{{.Name}} status={{.State.Status}} networks={{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}} ports={{json .NetworkSettings.Ports}}'
          done
          REMOTE
