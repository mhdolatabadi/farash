name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        shell: bash
        run: |
          if ! dart format --set-exit-if-changed .; then
            git diff -- .
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test --file-reporter json:/tmp/results.json
        env:
          CAPTURE_GLASS_UI: '1'
      - name: Report failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          names={}; prints={}; out=[]
          for line in open('/tmp/results.json'):
              try: e=json.loads(line)
              except Exception: continue
              t=e.get('type')
              if t=='testStart': names[e['test']['id']]=e['test']['name']
              if t=='print': prints.setdefault(e['testID'],[]).append(e.get('message',''))
              if t=='error' and 'phone' in names.get(e['testID'],''):
                  text=' '.join(prints.get(e['testID'],[])).replace('\n',' ')
                  text=' '.join(text.split())
                  for i in range(0,min(len(text),8000),900):
                      out.append(f"::error title=part{i//900}::{text[i:i+900]}")
          print('\n'.join(out[:9]))
          PY
      - name: Check agenda across daylight-saving changes
        run: flutter test test/due_views_test.dart
        env:
          TZ: Europe/Berlin
      - name: Upload UI review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farash-ui-review
          path: .impeccable/review/*.png
          if-no-files-found: ignore
          retention-days: 14
      - run: flutter build web --release --no-web-resources-cdn --dart-define=API_BASE_URL=https://todo.example.com
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android debug APK
        # The APK is meant to be installed, so it talks to the real server.
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.FARASH_API_BASE_URL || 'https://farash.mhdolatabadi.ir' }}
      - name: Require private signing for release tasks
        shell: bash
        run: |
          # Exercise the same public build entry point as a real release. Flutter
          # supplies Gradle properties and generates the wrapper for this SDK.
          if flutter build apk --release > "$RUNNER_TEMP/unsigned-release-check.log" 2>&1; then
            echo 'Release validation unexpectedly accepted missing signing material.' >&2
            exit 1
          fi
          if ! grep -q 'Release signing is required' "$RUNNER_TEMP/unsigned-release-check.log"; then
            echo 'Release failed before reaching the signing guard:' >&2
            cat "$RUNNER_TEMP/unsigned-release-check.log" >&2
            exit 1
          fi
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: farash-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: farash_test
          POSTGRES_USER: farash
          POSTGRES_PASSWORD: farash
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farash -d farash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://farash:farash@localhost:5432/farash_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      # -p 1: the store tests share one database and recreate its schema.
      - run: go test -p 1 ./...

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Flutter toolchain aligned
        run: python3 tool/check_flutter_toolchain.py
      - name: Validate shared nginx route
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/farash-nginx.conf" <<'EOF'
          events {}
          http {
            server {
              listen 8080;
              server_name farash.example;
              include /etc/nginx/farash.conf;
            }
          }
          EOF
          docker run --rm \
            -v "$RUNNER_TEMP/farash-nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/front-proxy.nginx.conf:/etc/nginx/farash.conf:ro" \
            nginx:alpine nginx -t
      - name: Validate Compose file
        working-directory: deploy
        run: cp .env.example .env && docker compose config --quiet
      - name: Preserve deployed Compose project and volume identities
        run: python3 tool/check_deploy_compose.py

  release-config:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: farash_release_check
      FARASH_PROXY_NETWORK: farash_release_check_proxy
    steps:
      - uses: actions/checkout@v4
      - name: Test immutable server deployment
        run: python3 -m unittest discover -s tool -p test_deploy_remote.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check workflow, scripts and signing preparation
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          bash -n deploy/deploy.sh deploy/backup.sh tool/verify_android_release.sh
          python3 -m unittest discover -s tool -p 'test_android*.py'
      - name: Exercise database backup and restore
        shell: bash
        run: |
          cp deploy/.env.example deploy/.env
          docker network create "$FARASH_PROXY_NETWORK"
          docker compose -f deploy/compose.yaml up -d postgres --wait
          docker compose -f deploy/compose.yaml exec -T postgres psql -U farash -d farash -v ON_ERROR_STOP=1 -c "CREATE TABLE backup_probe (value text); INSERT INTO backup_probe VALUES ('roundtrip');"
          bash deploy/backup.sh
          dump="$(find deploy/backups -name '*.dump' -type f)"
          sha256sum --check "$dump.sha256"
          docker compose -f deploy/compose.yaml exec -T postgres createdb -U farash farash_restore_probe
          docker compose -f deploy/compose.yaml exec -T postgres pg_restore --exit-on-error -U farash -d farash_restore_probe < "$dump"
          restored="$(docker compose -f deploy/compose.yaml exec -T postgres psql -U farash -d farash_restore_probe -Atc 'SELECT value FROM backup_probe')"
          [[ "$restored" == 'roundtrip' ]]
          docker compose -f deploy/compose.yaml stop postgres
          if bash deploy/backup.sh; then echo 'Backup unexpectedly succeeded without database.' >&2; exit 1; fi
          [[ "$(find deploy/backups -name '*.dump' -type f | wc -l)" -eq 1 ]]
          [[ -z "$(find deploy/backups -name '.pending.*' -type f)" ]]
      - name: Clean isolated test database
        if: always()
        run: |
          docker compose -f deploy/compose.yaml down -v
          docker network rm "$FARASH_PROXY_NETWORK" >/dev/null 2>&1 || true

  android-ui-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Test native capture navigation
        run: python3 -m unittest discover -s tool -p test_capture_android.py
      - name: Build offline UI review fixture
        run: flutter build apk --debug --target tool/scrum_preview.dart
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: python3 tool/capture_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farash-android-ui-review
          path: .impeccable/android-review/
          if-no-files-found: error
          retention-days: 14
