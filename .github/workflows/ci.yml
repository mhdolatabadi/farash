name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        shell: bash
        run: |
          if ! dart format --set-exit-if-changed .; then
            git diff -- .
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test
        env:
          CAPTURE_GLASS_UI: '1'
      - name: Upload UI review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farash-ui-review
          path: .impeccable/review/*.png
          if-no-files-found: ignore
          retention-days: 14
      - run: flutter build web --release --no-web-resources-cdn --dart-define=API_BASE_URL=https://todo.example.com
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android debug APK
        # The APK is meant to be installed, so it talks to the real server.
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.FARASH_API_BASE_URL || 'https://farash.mhdolatabadi.ir' }}
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: farash-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: farash_test
          POSTGRES_USER: farash
          POSTGRES_PASSWORD: farash
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farash -d farash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://farash:farash@localhost:5432/farash_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      # -p 1: the store tests share one database and recreate its schema.
      - run: go test -p 1 ./...

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e FARASH_DOMAIN=todo.example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate Compose file
        working-directory: deploy
        run: cp .env.example .env && docker compose config --quiet
