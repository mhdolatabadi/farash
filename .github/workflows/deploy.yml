name: Deploy web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: farash-production
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/api:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}/api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          build-args: |
            API_BASE_URL=
          tags: |
            ${{ env.IMAGE_REPO }}/web:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}/web:latest

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FARASH_SSH_HOST }}
          username: ${{ secrets.FARASH_SSH_USER }}
          key: ${{ secrets.FARASH_SSH_KEY }}
          port: ${{ secrets.FARASH_SSH_PORT || 22 }}
          source: "deploy/*"
          target: ${{ secrets.FARASH_DEPLOY_PATH }}
          strip_components: 1

      - name: Restart production stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          FARASH_DOMAIN: ${{ secrets.FARASH_DOMAIN }}
          FARASH_IMAGE_REPO: ${{ env.IMAGE_REPO }}
          FARASH_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          POSTGRES_PASSWORD: ${{ secrets.FARASH_POSTGRES_PASSWORD }}
          AUTH_JWT_SECRET: ${{ secrets.FARASH_AUTH_JWT_SECRET }}
          AUTH_TOKEN_TTL_HOURS: ${{ vars.FARASH_AUTH_TOKEN_TTL_HOURS || '24' }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.FARASH_GHCR_TOKEN }}
        with:
          host: ${{ secrets.FARASH_SSH_HOST }}
          username: ${{ secrets.FARASH_SSH_USER }}
          key: ${{ secrets.FARASH_SSH_KEY }}
          port: ${{ secrets.FARASH_SSH_PORT || 22 }}
          envs: FARASH_DOMAIN,FARASH_IMAGE_REPO,FARASH_IMAGE_TAG,POSTGRES_PASSWORD,AUTH_JWT_SECRET,AUTH_TOKEN_TTL_HOURS,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd "${{ secrets.FARASH_DEPLOY_PATH }}"
            chmod +x deploy.sh
            ./deploy.sh

      - name: Check health
        run: |
          curl --fail --retry 10 --retry-delay 6 --retry-all-errors \
            "https://${{ secrets.FARASH_DOMAIN }}/api/v1/health"
